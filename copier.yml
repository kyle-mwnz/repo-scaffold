# Copier template configuration for Azure Functions repository scaffolding
# Documentation: https://copier.readthedocs.io/

_min_copier_version: "9.0.0"
_subdirectory: "project"
_answers_file: .copier-answers.yml

# ============================================
# Questions (User Prompts)
# ============================================

serviceapplication_name:
  type: str
  help: |
    serviceapplication name (lowercase, alphanumeric, hyphens only).
    This will be used to generate all Azure resource names, with a repository name suffixed with -api.
    Examples: participant, appointment, circumstance, directory
  validator: >-
    {% if not (serviceapplication_name | regex_search('^[a-z][a-z0-9-]{2,20}$')) %}
    Must be 3-21 characters, lowercase alphanumeric with hyphens, starting with a letter
    {% endif %}

api_type:
  type: str
  help: What type of API/service is this?
  choices:
    REST API (HTTP triggers, OpenAPI): rest
    SOAP API (HTTP triggers, XML/WSDL): soap
    Event-driven (Service Bus triggers): event

# ============================================
# Computed Variables (for templates only)
# ============================================

# These are used in .jinja template files, not in tasks
# Tasks must use inline Jinja expressions
dotnet_version:
  type: str
  default: "10.0"
  when: false

pascal_case_name:
  type: str
  default: "{{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}"
  when: false

# ============================================
# Post-Generation Tasks
# ============================================

# Note: Tasks use inline Jinja expressions because computed variables
# with 'when: false' are not available in tasks

_tasks:
  # Pre-check: verify required CLI tools are installed
  - >-
    echo "Checking required tools..." &&
    (command -v func >/dev/null 2>&1 || { echo "ERROR: Azure Functions Core Tools (func) not found. Install from https://learn.microsoft.com/en-us/azure/azure-functions/functions-run-local"; exit 1; }) &&
    (command -v dotnet >/dev/null 2>&1 || { echo "ERROR: .NET SDK (dotnet) not found. Install from https://dotnet.microsoft.com/download"; exit 1; }) &&
    (command -v git >/dev/null 2>&1 || { echo "ERROR: Git not found. Install from https://git-scm.com/downloads"; exit 1; }) &&
    echo "All required tools found."

  # Initialize .NET Azure Functions project
  - >-
    cd {{ serviceapplication_name }}-api/src &&
    func init {{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}.Functions
    --worker-runtime dotnet-isolated
    --target-framework net10.0

  # Create initial function based on API type
  - >-
    cd {{ serviceapplication_name }}-api/src/{{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}.Functions &&
    func new --name HealthCheck --template "HTTP trigger" --authlevel anonymous &&
    {% if api_type == 'event' %}
    func new --name ProcessMessage --template "Azure Service Bus Queue trigger"
    {% else %}
    func new --name {{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}Api --template "HTTP trigger" --authlevel function
    {% endif %}

  # Create test project
  - >-
    cd {{ serviceapplication_name }}-api/tests &&
    dotnet new xunit -n {{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}.Functions.Tests &&
    cd {{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}.Functions.Tests &&
    dotnet add reference ../../src/{{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}.Functions/{{ serviceapplication_name | replace('-', ' ') | title | replace(' ', '') }}_Functions.csproj

  # Initialize git repository
  - "cd {{ serviceapplication_name }}-api && git init && git add . && git commit -m 'Initial scaffold from repo-scaffolds template'"
